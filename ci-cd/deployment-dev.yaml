kind: Service
apiVersion: v1
metadata:
  name: helpcenter-h5-dev
spec:
  selector:
    app: helpcenter-h5-dev
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helpcenter-h5-dev-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  rules:
  - host: home-dev.veoride.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: helpcenter-h5-dev
            port:
              number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpcenter-h5-dev-deployment
spec:
  selector:
    matchLabels:
      app: helpcenter-h5-dev
  replicas: 1
  template:
    metadata:
      labels:
        app: helpcenter-h5-dev
    spec:
      containers:
      - name: helpcenter-h5-dev
        image: 488938767527.dkr.ecr.us-east-2.amazonaws.com/veo-service:helpcenter-h5-test
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
